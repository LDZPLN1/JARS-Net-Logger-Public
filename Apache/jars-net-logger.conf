    <IfModule mod_headers.c>
        <FilesMatch "\.(ico|jpg|png)$">
            Header set Cache-Control "max-age=14400, public"
        </FilesMatch>
        <FilesMatch "\.(css|js)$">
            Header unset Vary
            Header set Cache-Control "max-age=14400, public"
        </FilesMatch>
    </IfModule>

    Alias %VDIR_SHORT%/api %VDIR%/api/jars_api.php

    <Directory "%VDIR%">
        Options -Indexes +FollowSymLinks
    </Directory>

    ProxyPreserveHost On
    ProxyPass /socket.io http://localhost:3000/socket.io upgrade=websocket
    ProxyPassReverse /socket.io http://localhost:3000/socket.io
